services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - "4999:4999"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: "development"

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile.dev
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
    environment:
      NODE_ENV: "development"

  redis:
    ports:
      - "${REDIS_PORT}:6379"
