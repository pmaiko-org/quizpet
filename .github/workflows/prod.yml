name: Prod Build

on:
  push:
    branches:
      - main

concurrency:
  group: quizpet-production
  cancel-in-progress: true

jobs:
  build-prod:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync code to server folder
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='rclone/rclone.conf' \
            ./ /home/petya/projects/quizpet/

      - name: Run make prod
        working-directory: /home/petya/projects/quizpet
        run: make prod