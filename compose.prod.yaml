services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - frontend-static:/app/.output/public:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      STATIC_DIR: /static
    volumes:
      - frontend-static:/static

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: "production"

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: ${CMS_PUBLIC_URL}
        DATABASE_CLIENT: ${CMS_DATABASE_CLIENT}
    environment:
      NODE_ENV: "production"
