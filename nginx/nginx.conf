user nginx;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    proxy_cache_path /var/cache/nginx/media
        levels=1:2
        keys_zone=media:16m
        max_size=1g
        inactive=30d
        use_temp_path=off;

    upstream frontend_upstream {
        server p-quizpet-frontend:5001;
        keepalive 32;
    }

    upstream backend_upstream {
        server p-quizpet-backend:5002;
        keepalive 32;
    }

    upstream cms_upstream {
        server p-quizpet-cms:1337;
        keepalive 16;
    }

    server {
        listen 4999;

        charset utf-8;
        client_max_body_size 50M;

        location ^~ /_nuxt/ {
            root /app/.output/public;
            expires 365d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
            root /app/.output/public;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate";
            add_header Pragma "no-cache";
        }

        location = /backend {
            return 301 /backend/;
        }

        location ^~ /backend/storage/ {
            proxy_pass http://backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache media;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Cache-Control Expires;
            proxy_read_timeout 120s;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=432000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location ^~ /backend/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location = /cms {
            return 301 /cms/;
        }

        location ^~ /cms/uploads/ {
            proxy_pass http://cms_upstream/uploads/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache media;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Cache-Control Expires;
            proxy_read_timeout 120s;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=432000";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location ^~ /cms/ {
            proxy_pass http://cms_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
