networks:
  shared_network:
    external: true
  internal_network:
    name: "${PROJECT_PREFIX}-internal_network"
    driver: bridge

volumes:
  db-data:
  frontend-static:
  nginx-cache:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    container_name: "${PROJECT_PREFIX}-nginx"
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - shared_network
      - internal_network
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4999/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: "${PROJECT_PREFIX}-frontend"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      cms:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal_network
    environment:
      NITRO_PORT: ${FRONTEND_PORT}
      NUXT_BACKEND_API_INTERNAL_URL: http://${PROJECT_PREFIX}-backend:${BACKEND_PORT}/backend
      NUXT_PUBLIC_BACKEND_API_URL: /backend
      NUXT_PUBLIC_CMS_API_URL: ${NUXT_PUBLIC_CMS_API_URL:?NUXT_PUBLIC_CMS_API_URL is required}
      NUXT_CMS_INTERNAL_URL: http://${PROJECT_PREFIX}-cms:${CMS_PORT}/api
      NUXT_REDIS_URL: redis://${PROJECT_PREFIX}-redis:6379
      NUXT_REVALIDATE_SECRET: ${NUXT_REVALIDATE_SECRET:?NUXT_REVALIDATE_SECRET is required}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${FRONTEND_PORT}/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  backend:
    container_name: "${PROJECT_PREFIX}-backend"
    restart: unless-stopped
    networks:
      - internal_network
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./rclone:/root/.config/rclone
    environment:
      PORT: ${BACKEND_PORT}

      RCLONE_STORAGE_REMOTE: ${RCLONE_STORAGE_REMOTE:-gdrive:}
      RCLONE_VFS_CACHE_MODE: ${RCLONE_VFS_CACHE_MODE:-off}

      DB_HOST: "${PROJECT_PREFIX}-db"
      DB_PORT: ${POSTGRES_INTERNAL_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      CMS_DATABASE_NAME: ${CMS_DATABASE_NAME}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /storage fuse' /proc/mounts || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  cms:
    container_name: "${PROJECT_PREFIX}-cms"
    restart: unless-stopped
    networks:
      - internal_network
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./rclone:/root/.config/rclone
    environment:
      RCLONE_CMS_REMOTE: ${RCLONE_CMS_REMOTE:-gdrive:cms}
      RCLONE_CMS_VFS_CACHE_MODE: ${RCLONE_CMS_VFS_CACHE_MODE:-off}

      HOST: ${CMS_HOST}
      PORT: ${CMS_PORT}
      PUBLIC_URL: ${CMS_PUBLIC_URL}
      IS_PROXIED: ${CMS_IS_PROXIED}

      DATABASE_CLIENT: ${CMS_DATABASE_CLIENT}
      DATABASE_HOST: "${PROJECT_PREFIX}-db"
      DATABASE_PORT: ${POSTGRES_INTERNAL_PORT}
      DATABASE_NAME: ${CMS_DATABASE_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: ${CMS_DATABASE_SSL}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${CMS_DATABASE_SSL_REJECT_UNAUTHORIZED}
      DATABASE_SCHEMA: ${CMS_DATABASE_SCHEMA}
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 10
      DATABASE_CONNECTION_TIMEOUT: 60000

      APP_KEYS: ${CMS_APP_KEYS}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET}
      JWT_SECRET: ${CMS_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY}
      CMS_PREVIEW_SECRET: ${CMS_PREVIEW_SECRET:?CMS_PREVIEW_SECRET is required}
      CMS_PREVIEW_URL: ${CMS_PREVIEW_URL:?CMS_PREVIEW_URL is required}
      NUXT_REVALIDATE_SECRET: ${NUXT_REVALIDATE_SECRET:?NUXT_REVALIDATE_SECRET is required}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${CMS_PORT}/_health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  db:
    image: postgres:17-alpine
    container_name: "${PROJECT_PREFIX}-db"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - CMS_DATABASE_NAME=${CMS_DATABASE_NAME:?CMS_DATABASE_NAME is required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_network
    ports:
      - "${POSTGRES_BIND_IP:-0.0.0.0}:${POSTGRES_PORT}:${POSTGRES_INTERNAL_PORT}"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: "${PROJECT_PREFIX}-redis"
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--bind", "0.0.0.0",
        "--save", "",
        "--appendonly", "no",
        "--maxmemory", "64mb",
        "--maxmemory-policy", "allkeys-lru"
      ]
    mem_limit: 128mb
    networks:
      - internal_network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
